<section
  class="feedback-state"
  [class.feedback-state--error]="tone === 'error'"
>

  <div class="feedback-state__icon">
    {{ icon }}
  </div>

  <h2 class="feedback-state__title">
    {{ title }}
  </h2>

  <p class="feedback-state__message">
    {{ message }}
  </p>

  @if (actionLabel) {
    <button
      type="button"
      class="feedback-state__action"
      (click)="onAction()"
    >
      {{ actionLabel }}
    </button>
  }

</section>
